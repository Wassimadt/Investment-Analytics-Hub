kind = "web"
previewPath = "/"
title = "FNI — Plateforme d'Investissement"
version = "1.0.0"
id = "artifacts/fni-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23004

[services.development]
run = "pnpm --filter @workspace/fni-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fni-platform", "run", "build" ]
publicDir = "artifacts/fni-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23004"
BASE_PATH = "/"
